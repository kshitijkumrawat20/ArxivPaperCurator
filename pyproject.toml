[project]
name = "arxivpapercurator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apache-airflow>=3.2.2",
    "asgi-lifespan>=2.1.0",
    "docling>=2.108.0",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "opencv-python>=5.0.0.93",
    "opensearch-py>=3.2.0",
    "polyfactory>=3.3.0",
    "psycopg2>=2.9.12",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "sqlalchemy>=2.0.51",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "uvicorn>=0.49.0",
]

# PyPI's Linux PyTorch wheels include CUDA libraries. Pin PyTorch packages to
# the official CPU-only index so Docker images don't pull NVIDIA dependencies.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
